# Scoring semanal: carga el modelo campeón y escribe las predicciones.
#
# El notebook carga el modelo por alias, así que promover una versión nueva a
# @campeon no requiere tocar este archivo.

resources:
  jobs:
    job_scoring:
      name: inchcape_scoring_demanda
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Bogota

      email_notifications:
        on_failure:
          - ${var.correo_alertas}

      tasks:
        - task_key: scoring
          notebook_task:
            notebook_path: ../notebooks/02_scoring_demanda.py
            base_parameters:
              catalogo: ${var.catalogo}
              esquema: ${var.esquema_ml}
              modelo: ${var.modelo}
              alias: campeon
              horizonte_semanas: "4"
          timeout_seconds: 1800

        # Control de calidad sobre lo que acabó de escribir el scoring. Si la
        # predicción sale vacía, negativa o con un salto absurdo contra la
        # semana pasada, el job falla acá y no en la reunión de compras.
        - task_key: control_calidad
          depends_on:
            - task_key: scoring
          notebook_task:
            notebook_path: ../notebooks/04_control_prediccion.py
            base_parameters:
              catalogo: ${var.catalogo}
              esquema: ${var.esquema_ml}
              desvio_maximo_pct: "40"
          timeout_seconds: 600
