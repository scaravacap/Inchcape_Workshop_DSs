# Reentrenamiento mensual.
#
# El job entrena y registra una versión nueva, pero NO la promueve a @campeon.
# La promoción queda como decisión de una persona, con el criterio escrito en
# SKILLS.md. Automatizar el alias es automatizar la decisión de negocio.

resources:
  jobs:
    job_entrenamiento:
      name: inchcape_entrenamiento_demanda
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 3 1 * ?"
        timezone_id: America/Bogota

      email_notifications:
        on_failure:
          - ${var.correo_alertas}
        on_success:
          - ${var.correo_alertas}

      tasks:
        - task_key: features
          notebook_task:
            notebook_path: ../notebooks/01_features_demanda.py
            base_parameters:
              catalogo: ${var.catalogo}
              esquema: ${var.esquema_ml}
          timeout_seconds: 2400

        - task_key: entrenamiento
          depends_on:
            - task_key: features
          notebook_task:
            notebook_path: ../notebooks/02_entrenamiento_demanda.py
            base_parameters:
              catalogo: ${var.catalogo}
              esquema: ${var.esquema_ml}
              modelo: ${var.modelo}
              semanas_validacion: "13"
          timeout_seconds: 3600

        # Compara la versión nueva contra la que está en @campeon y contra la
        # línea base ingenua. No promueve: deja el reporte y notifica.
        - task_key: evaluacion_candidato
          depends_on:
            - task_key: entrenamiento
          notebook_task:
            notebook_path: ../notebooks/05_evaluar_candidato.py
            base_parameters:
              catalogo: ${var.catalogo}
              esquema: ${var.esquema_ml}
              modelo: ${var.modelo}
              mejora_minima_pct: "5"
          timeout_seconds: 900
